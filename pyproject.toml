[project]
name = "firm-reverse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Iana Lin", email = "ianalin123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "litert-lm-api>=0.18.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pypdf>=6.21.2",
    "pyserial>=3.5",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
firm-reverse = "firm_reverse.cli:main"
firm-reverse-serve = "firm_reverse.server:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
