<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firm Reverse</title>
<style>
  :root {
    --paper: #f3f6f7;
    --panel: #ffffff;
    --ink: #15222e;
    --muted: #5d6b77;
    --rule: #d5dde2;
    --trace: #2457c5;
    --decode: #e0a100;
    --decode-ink: #4a3500;
    --fault: #c23b22;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
  header { display: flex; align-items: baseline; gap: 16px; padding: 18px 24px 10px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; font-stretch: condensed; }
  .offline { color: var(--muted); font-size: 13px; }
  .offline::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2f9e5b; margin-right: 6px; }
  main { display: grid; grid-template-columns: 280px 1fr; gap: 20px; padding: 8px 24px 32px; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .drop { background: var(--panel); border: 1.5px dashed var(--rule); border-radius: 6px; padding: 14px; cursor: pointer; }
  .drop:hover, .drop:focus-within { border-color: var(--trace); }
  .drop strong { display: block; font-size: 14px; }
  .drop span { color: var(--muted); font-size: 13px; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 3px; }
  .mode { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .text h1, .text h2, .text h3 { font-size: 15px; margin: 14px 0 4px; }
  .text h1:first-child, .text h2:first-child { margin-top: 0; }
  .text ul { margin: 4px 0; padding-left: 20px; }
  .text code { font: 12.5px var(--mono); background: var(--paper); padding: 1px 4px; border-radius: 3px; }
  .text.rendered { white-space: normal; }
  .text.rendered p { margin: 6px 0; }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  button { font: 600 15px var(--sans); background: var(--ink); color: #fff; border: 0; border-radius: 6px; padding: 12px; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible, .drop:focus-within { outline: 2px solid var(--trace); outline-offset: 2px; }
  .steps { list-style: none; margin: 4px 0 0; padding: 0; font-size: 13px; color: var(--muted); }
  .steps li { padding: 3px 0; }
  .steps li.active { color: var(--ink); font-weight: 600; }
  .steps li.done { color: var(--ink); }
  .steps li.done::after { content: " ✓"; color: #2f9e5b; }
  .wave { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 0 6px; }
  .wave canvas { width: 100%; display: block; }
  .wave .empty { color: var(--muted); padding: 40px 16px; text-align: center; }
  .summary { font: 12.5px/1.6 var(--mono); white-space: pre-wrap; color: var(--muted); margin: 10px 16px 4px; }
  .out { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 20px; margin-top: 20px; }
  section h2 { font-size: 15px; margin: 0 0 8px; }
  .text { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; min-height: 120px; white-space: pre-wrap; max-width: 80ch; }
  .text:empty::before { content: attr(data-empty); color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 14px; }
  td { padding: 6px 10px; border-top: 1px solid var(--rule); vertical-align: top; }
  td.mark { font-family: var(--mono); font-weight: 600; }
  .sheet { color: var(--trace); }
  .error { color: var(--fault); font-weight: 600; }
  @media (max-width: 820px) { main, .out { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: no-preference) { .steps li.active::after { content: " …"; } }
</style>
</head>
<body>
<header>
  <h1>Firm Reverse</h1>
  <span class="offline">Runs on this bench. Nothing leaves it.</span>
</header>
<main>
  <aside>
    <label class="drop">
      <strong>Chip photos</strong>
      <span id="photoHint">One close-up per chip, markings in focus</span>
      <input id="photo" type="file" accept="image/*" multiple>
      <div class="thumbs" id="thumbs"></div>
    </label>
    <label class="mode"><input type="checkbox" id="wholeBoard"> These are whole-board photos</label>
    <label class="drop">
      <strong>Signal capture</strong>
      <span id="captureName">CSV or VCD from Logic 2 or WaveForms</span>
      <input id="capture" type="file" accept=".csv,.vcd">
    </label>
    <button id="go" disabled>Reverse this board</button>
    <ol class="steps" id="steps">
      <li data-step="signals">Decode signals</li>
      <li data-step="parts">Identify parts</li>
      <li data-step="behaviour">Explain behaviour</li>
      <li data-step="spec">Write spec</li>
    </ol>
  </aside>
  <div>
    <div class="wave">
      <div class="empty" id="waveEmpty">Add a signal capture to see the decoded bus traffic.</div>
      <canvas id="wave" height="0"></canvas>
      <div class="summary" id="summary"></div>
    </div>
    <div class="out">
      <section>
        <h2>Parts</h2>
        <table id="parts" hidden></table>
        <h2>Behaviour</h2>
        <div class="text" id="behaviour" data-empty="What the device is doing, from its signals."></div>
      </section>
      <section>
        <h2>Functional spec</h2>
        <div class="text" id="spec" data-empty="A spec you can hand to a design team for a clean-room rebuild."></div>
      </section>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let summary = "";

function setStep(step, state) {
  const li = document.querySelector(`[data-step="${step}"]`);
  if (!li) return;
  if (state === "active") document.querySelectorAll(".steps li.active").forEach((x) => { x.classList.remove("active"); x.classList.add("done"); });
  li.classList.remove("active", "done");
  li.classList.add(state);
}

$("photo").addEventListener("change", () => {
  const files = [...$("photo").files];
  $("thumbs").replaceChildren(...files.map((f) => Object.assign(document.createElement("img"), { src: URL.createObjectURL(f), alt: f.name })));
  $("photoHint").textContent = `${files.length} photo${files.length === 1 ? "" : "s"}`;
});

$("capture").addEventListener("change", async () => {
  const file = $("capture").files[0];
  if (!file) return;
  $("captureName").textContent = file.name;
  setStep("signals", "active");
  const body = new FormData();
  body.append("capture", file);
  const res = await fetch("/api/signals", { method: "POST", body });
  const data = await res.json();
  if (!res.ok) {
    showError("summary", `Couldn't read this capture: ${data.detail}`);
    return;
  }
  summary = data.summary;
  $("summary").textContent = summary;
  drawWave(data.wave);
  setStep("signals", "done");
  $("go").disabled = false;
});

function drawWave({ channels, frames }) {
  const canvas = $("wave");
  $("waveEmpty").hidden = true;
  const lane = 54, labelW = 64, dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  canvas.height = channels.length * lane * dpr;
  canvas.style.height = channels.length * lane + "px";
  canvas.width = width * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  channels.forEach((c, i) => {
    const [t0, t1] = c.window;
    const x = (t) => labelW + ((t - t0) / (t1 - t0)) * (width - labelW - 12);
    const top = i * lane + 10, high = top + 4, low = top + 30;
    ctx.fillStyle = css.getPropertyValue("--muted");
    ctx.font = "600 12px " + css.getPropertyValue("--sans");
    ctx.fillText(c.name, 12, low - 8);
    ctx.strokeStyle = css.getPropertyValue("--trace");
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let prevY = null;
    for (const [t, level] of c.edges) {
      if (t > t1) break;
      const y = level ? high : low;
      const px = x(Math.max(t, t0));
      if (prevY === null) ctx.moveTo(px, y); else { ctx.lineTo(px, prevY); ctx.lineTo(px, y); }
      prevY = y;
    }
    ctx.lineTo(x(t1), prevY ?? low);
    ctx.stroke();
    ctx.font = "11px " + css.getPropertyValue("--mono");
    let lastRight = -Infinity;
    for (const f of frames.filter((f) => f.channel === c.name && f.t >= t0 && f.t <= t1)) {
      const px = x(f.t), w = ctx.measureText(f.label).width + 8;
      if (px < lastRight + 2) continue;
      ctx.fillStyle = css.getPropertyValue("--decode");
      ctx.fillRect(px, low + 4, w, 15);
      ctx.fillStyle = css.getPropertyValue("--decode-ink");
      ctx.fillText(f.label, px + 4, low + 15);
      lastRight = px + w;
    }
  });
}

$("go").addEventListener("click", async () => {
  $("go").disabled = true;
  ["behaviour", "spec"].forEach((id) => { $(id).textContent = ""; $(id).classList.remove("rendered"); });
  $("parts").hidden = true;
  const body = new FormData();
  body.append("summary", summary);
  body.append("close_up", $("wholeBoard").checked ? "false" : "true");
  for (const file of $("photo").files) body.append("photos", file);
  const res = await fetch("/api/run", { method: "POST", body });
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const chunks = buffer.split("\n\n");
    buffer = chunks.pop();
    chunks.filter((c) => c.startsWith("data: ")).forEach((c) => handle(JSON.parse(c.slice(6))));
  }
  $("go").disabled = false;
});

function handle(ev) {
  if (ev.kind === "step") setStep(ev.step, "active");
  if (ev.kind === "token" && ev.step !== "parts") $(ev.step).textContent += ev.text;
  if (ev.kind === "parts") renderParts(ev.parts);
  if (ev.kind === "step" && ev.step === "spec") renderMarkdown("behaviour");
  if (ev.kind === "done") renderMarkdown("spec");
  if (ev.kind === "done") document.querySelectorAll(".steps li.active").forEach((x) => { x.classList.remove("active"); x.classList.add("done"); });
  if (ev.kind === "error") showError("spec", `The model stopped: ${ev.message}`);
}

function renderMarkdown(id) {
  const el = $(id);
  const inline = (s) => {
    const span = document.createElement("span");
    s.split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach((piece) => {
      if (piece.startsWith("`") && piece.endsWith("`") && piece.length > 1) span.append(Object.assign(document.createElement("code"), { textContent: piece.slice(1, -1) }));
      else if (piece.startsWith("**") && piece.endsWith("**")) span.append(Object.assign(document.createElement("strong"), { textContent: piece.slice(2, -2) }));
      else span.append(piece);
    });
    return span;
  };
  const out = [];
  let list = null;
  for (const raw of el.textContent.split("\n")) {
    const line = raw.trimEnd();
    const heading = line.match(/^(#{1,3})\s+(.*)/);
    const item = line.match(/^\s*[*-]\s+(.*)/);
    if (item) {
      if (!list) out.push((list = document.createElement("ul")));
      const li = document.createElement("li");
      li.append(inline(item[1]));
      list.append(li);
      continue;
    }
    list = null;
    if (heading) out.push(Object.assign(document.createElement("h" + (heading[1].length + 1)), { textContent: heading[2] }));
    else if (line) { const p = document.createElement("p"); p.append(inline(line)); out.push(p); }
  }
  el.replaceChildren(...out);
  el.classList.add("rendered");
}

function showError(id, message) {
  const span = document.createElement("span");
  span.className = "error";
  span.textContent = message;
  $(id).replaceChildren(span);
}

function renderParts(parts) {
  const table = $("parts");
  table.innerHTML = "";
  for (const p of parts) {
    const row = table.insertRow();
    row.insertCell().outerHTML = `<td class="mark"></td>`;
    row.cells[0].textContent = p.marking;
    row.insertCell().textContent = `${p.kind}, ${p.location}`;
    const sheet = row.insertCell();
    sheet.className = "sheet";
    sheet.textContent = p.datasheet ? p.datasheet : "no datasheet";
  }
  table.hidden = !parts.length;
}
</script>
</body>
</html>
